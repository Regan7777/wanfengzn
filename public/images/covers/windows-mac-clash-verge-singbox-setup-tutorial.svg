<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="badge_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow_left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 100) rotate(45) scale(220)">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow_right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(680 360) rotate(45) scale(260)">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#93C5FD" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg_grad)"/>

  <!-- Subtle Grid -->
  <rect width="800" height="450" fill="url(#grid_pattern)"/>

  <!-- Ambient Glows -->
  <circle cx="140" cy="100" r="220" fill="url(#glow_left)"/>
  <circle cx="680" cy="360" r="260" fill="url(#glow_right)"/>

  <!-- Outer Glass Frame -->
  <rect x="50" y="40" width="700" height="370" rx="20" stroke="#93C5FD" stroke-opacity="0.18" stroke-width="1.5" fill="#0F172A" fill-opacity="0.4"/>

  <!-- Top Badges / Indicators (Windows and macOS) -->
  <g transform="translate(400, 120)">
    <!-- Pill Container -->
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="url(#badge_grad)" stroke="#60A5FA" stroke-opacity="0.3" stroke-width="1"/>
    
    <!-- Windows Mini Icon -->
    <g transform="translate(-112, -7)">
      <rect x="0" y="0" width="6" height="6" rx="1" fill="#60A5FA"/>
      <rect x="8" y="0" width="6" height="6" rx="1" fill="#60A5FA"/>
      <rect x="0" y="8" width="6" height="6" rx="1" fill="#60A5FA"/>
      <rect x="8" y="8" width="6" height="6" rx="1" fill="#60A5FA"/>
    </g>
    
    <!-- Text -->
    <text x="-10" y="5" text-anchor="middle" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">WINDOWS &amp; MACOS</text>

    <!-- Apple Mini Icon Dot / Accent -->
    <circle cx="106" cy="0" r="4" fill="#60A5FA"/>
  </g>

  <!-- Main Title -->
  <text x="400" y="215" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="bold" letter-spacing="0.5">Windows 与 macOS 客户端配置</text>

  <!-- Subtitle -->
  <text x="400" y="275" text-anchor="middle" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">Clash Verge Rev • Sing-box • TUN 模式实操</text>

  <!-- Bottom Pills / Tags -->
  <g transform="translate(400, 335)">
    <!-- Tag 1 -->
    <rect x="-215" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="-150" y="4" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Mihomo 内核</text>

    <!-- Tag 2 -->
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">一键订阅导入</text>

    <!-- Tag 3 -->
    <rect x="85" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="150" y="4" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">全局虚拟网卡</text>
  </g>
</svg>
