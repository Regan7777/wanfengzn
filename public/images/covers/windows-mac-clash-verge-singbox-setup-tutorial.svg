<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="wmBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090e1c"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="clashOfficialBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <radialGradient id="wmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(185 225) scale(185)">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <filter id="iconShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#wmBg)"/>
  
  <pattern id="wmGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#wmGrid)"/>

  <!-- 光晕 -->
  <circle cx="185" cy="225" r="185" fill="url(#wmGlow)"/>

  <!-- 外边框 -->
  <rect x="25" y="25" width="750" height="400" rx="16" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.2"/>
  <rect x="28" y="28" width="744" height="394" rx="14" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- 左侧图形：笔记本电脑屏幕 + 官方 Clash 猫咪大图标 -->
  <g transform="translate(185, 225)">
    <ellipse cx="0" cy="115" rx="95" ry="16" fill="#000000" fill-opacity="0.6"/>

    <!-- 笔记本显示器外框 -->
    <rect x="-85" y="-95" width="170" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2.5"/>
    <rect x="-79" y="-89" width="158" height="98" rx="5" fill="#090d16"/>
    
    <!-- 笔记本底座 -->
    <path d="M -105 15 L 105 15 L 90 28 L -90 28 Z" fill="#334155"/>
    <rect x="-24" y="16" width="48" height="4" rx="2" fill="#64748b"/>

    <!-- 官方 Clash 猫咪应用图标卡片 (立体浮于屏幕中央) -->
    <g transform="translate(0, -38)" filter="url(#iconShadow)">
      <rect x="-42" y="-42" width="84" height="84" rx="20" fill="url(#clashOfficialBlue)" stroke="#7dd3fc" stroke-opacity="0.7" stroke-width="1.5"/>
      
      <!-- 官方 Clash 猫咪头部剪影 -->
      <path d="M -13 -12 C -6 -10, 6 -10, 13 -12 C 17 -18, 22 -25, 27 -29 C 29 -22, 31 -13, 31 -6 C 35 3, 35 14, 25 23 C 15 29, -15 29, -25 23 C -35 14, -35 3, -31 -6 C -31 -13, -29 -22, -27 -29 C -22 -25, -17 -18, -13 -12 Z" fill="#ffffff"/>
      <path d="M -14 -10 L -23 -23 C -25 -17, -26 -10, -25 -5 Z" fill="#bae6fd"/>
      <path d="M 14 -10 L 23 -23 C 25 -17, 26 -10, 25 -5 Z" fill="#bae6fd"/>
      <circle cx="-10" cy="2" r="3.2" fill="#0f172a"/>
      <circle cx="10" cy="2" r="3.2" fill="#0f172a"/>
      <circle cx="-9" cy="0.8" r="1" fill="#ffffff"/>
      <circle cx="11" cy="0.8" r="1" fill="#ffffff"/>
      <path d="M -1.8 8 L 1.8 8 L 0 10.5 Z" fill="#0f172a"/>
      <path d="M -4.5 11.5 Q -2 14 0 12 Q 2 14 4.5 11.5" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <line x1="-23" y1="3" x2="-33" y2="1" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="-23" y1="9" x2="-33" y2="11" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="23" y1="3" x2="33" y2="1" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="23" y1="9" x2="33" y2="11" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 右侧文案与排版 -->
  <g transform="translate(345, 75)">
    <!-- 顶部标签组 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="134" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1"/>
      <text x="67" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WINDOWS &amp; MAC</text>
      
      <rect x="144" y="0" width="104" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="196" y="17" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Clash Verge</text>
      
      <rect x="258" y="0" width="86" height="26" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
      <text x="301" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TUN 模式</text>
    </g>

    <!-- 主标题 -->
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800">Win / Mac 电脑配置教程</text>
    <text x="0" y="112" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">Clash Verge Rev • Sing-box 客户端实操</text>

    <!-- 四项特性 -->
    <g transform="translate(0, 145)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ Mihomo 内核</text>
        <text x="108" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">最新版本</text>
      </g>
      
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 虚拟网卡</text>
        <text x="88" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">接管整机流量</text>
      </g>
      
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 订阅一键导入</text>
        <text x="110" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">秒速加载</text>
      </g>
      
      <g transform="translate(205, 52)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 智能分流</text>
        <text x="80" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">国内直连省流量</text>
      </g>
    </g>

    <!-- 底部状态栏 -->
    <g transform="translate(0, 270)">
      <line x1="0" y1="0" x2="395" y2="0" stroke="#334155" stroke-width="1"/>
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">晚风博客技术评测室 · WANFENGZN.COM</text>
      <text x="395" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="end">W 资深网络实测</text>
    </g>
  </g>
</svg>
