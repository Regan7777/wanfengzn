<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9D174D"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="badge_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow_left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 100) rotate(45) scale(220)">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow_right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(680 360) rotate(45) scale(260)">
      <stop offset="0%" stop-color="#DB2777" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9D174D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F472B6" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg_grad)"/>
  <rect width="800" height="450" fill="url(#grid_pattern)"/>
  <circle cx="140" cy="100" r="220" fill="url(#glow_left)"/>
  <circle cx="680" cy="360" r="260" fill="url(#glow_right)"/>

  <rect x="50" y="40" width="700" height="370" rx="20" stroke="#F472B6" stroke-opacity="0.18" stroke-width="1.5" fill="#0F172A" fill-opacity="0.4"/>

  <!-- Top Badge -->
  <g transform="translate(400, 120)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="url(#badge_grad)" stroke="#F472B6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#FBCFE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">FLOWERCLOUD AIRPORT REVIEW</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="215" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="bold" letter-spacing="0.5">花云 机场深度评测</text>
  <text x="400" y="275" text-anchor="middle" fill="#FBCFE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">顶级 IEPL 专线 • 0.2倍率节点 • 星链与住宅落地</text>

  <!-- Feature Pills -->
  <g transform="translate(400, 335)">
    <rect x="-215" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="-150" y="4" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">1000Mbps 千兆</text>
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">0.2倍率神技</text>
    <rect x="85" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="150" y="4" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">流媒体全区解锁</text>
  </g>
</svg>
