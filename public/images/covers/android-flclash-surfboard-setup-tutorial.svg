<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="anBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#042017"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Android 翡翠绿结合 Clash 蓝 -->
    <linearGradient id="clashOfficialBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <radialGradient id="anGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(185 225) scale(185)">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <filter id="iconShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#anBg)"/>
  
  <pattern id="anGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-opacity="0.04" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#anGrid)"/>

  <!-- 光晕 -->
  <circle cx="185" cy="225" r="185" fill="url(#anGlow)"/>

  <!-- 外边框 -->
  <rect x="25" y="25" width="750" height="400" rx="16" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.2"/>
  <rect x="28" y="28" width="744" height="394" rx="14" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- 左侧图形：安卓手机与官方 Clash 猫咪 App 图标 -->
  <g transform="translate(185, 220)">
    <ellipse cx="0" cy="120" rx="90" ry="16" fill="#000000" fill-opacity="0.65"/>

    <!-- 安卓手机机身 (微圆角方形打孔屏) -->
    <rect x="-72" y="-125" width="144" height="240" rx="20" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <rect x="-66" y="-119" width="132" height="228" rx="16" fill="#0b1120"/>
    
    <!-- 中置挖孔摄像头 -->
    <circle cx="0" cy="-105" r="4.5" fill="#020617"/>

    <!-- 官方 Clash 猫咪 App 图标 (浮于屏幕) -->
    <g transform="translate(0, -10)" filter="url(#iconShadow)">
      <rect x="-48" y="-48" width="96" height="96" rx="22" fill="url(#clashOfficialBlue)" stroke="#7dd3fc" stroke-opacity="0.7" stroke-width="1.5"/>
      
      <!-- 官方 Clash 猫咪白底剪影 -->
      <path d="M -15 -14 C -7 -12, 7 -12, 15 -14 C 20 -21, 26 -29, 31 -33 C 34 -25, 36 -15, 36 -7 C 41 4, 41 16, 29 26 C 17 33, -17 33, -29 26 C -41 16, -41 4, -36 -7 C -36 -15, -34 -25, -31 -33 C -26 -29, -20 -21, -15 -14 Z" fill="#ffffff"/>
      <path d="M -16 -12 L -27 -27 C -29 -20, -30 -12, -29 -6 Z" fill="#bae6fd"/>
      <path d="M 16 -12 L 27 -27 C 29 -20, 30 -12, 29 -6 Z" fill="#bae6fd"/>
      <circle cx="-12" cy="2" r="4" fill="#0f172a"/>
      <circle cx="12" cy="2" r="4" fill="#0f172a"/>
      <circle cx="-10.5" cy="0.8" r="1.3" fill="#ffffff"/>
      <circle cx="13.5" cy="0.8" r="1.3" fill="#ffffff"/>
      <path d="M -2 9 L 2 9 L 0 11.5 Z" fill="#0f172a"/>
      <path d="M -5 13 Q -2.5 16 0 13.5 Q 2.5 16 5 13" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <line x1="-27" y1="3" x2="-40" y2="1" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-27" y1="10" x2="-40" y2="13" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="27" y1="3" x2="40" y2="1" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="27" y1="10" x2="40" y2="13" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 底部状态药丸 -->
    <rect x="-48" y="58" width="96" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <circle cx="-34" cy="70" r="3.5" fill="#10b981"/>
    <text x="-24" y="74" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold">FlClash · 运行中</text>
  </g>

  <!-- 右侧文字与排版 -->
  <g transform="translate(345, 75)">
    <!-- 顶部标签组 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="84" height="26" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
      <text x="42" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ANDROID</text>
      
      <rect x="94" y="0" width="86" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1"/>
      <text x="137" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Flclash</text>
      
      <rect x="190" y="0" width="94" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="237" y="17" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Surfboard</text>
    </g>

    <!-- 主标题 -->
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">Android 客户端配置教程</text>
    <text x="0" y="112" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">Flclash • Surfboard • 后台保活与自启实操</text>

    <!-- 四项特性 -->
    <g transform="translate(0, 145)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ Flclash</text>
        <text x="80" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">现代化安卓首选</text>
      </g>
      
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 电池白名单</text>
        <text x="100" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">防止后台断流</text>
      </g>
      
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 一键订阅导入</text>
        <text x="110" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">秒速解析</text>
      </g>
      
      <g transform="translate(205, 52)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 规则分流</text>
        <text x="80" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">国内直连免流</text>
      </g>
    </g>

    <!-- 底部状态栏 -->
    <g transform="translate(0, 270)">
      <line x1="0" y1="0" x2="395" y2="0" stroke="#334155" stroke-width="1"/>
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">晚风博客技术评测室 · WANFENGZN.COM</text>
      <text x="395" y="24" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="end">W 资深网络实测</text>
    </g>
  </g>
</svg>
