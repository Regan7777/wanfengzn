<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- 深邃暗黑背景 -->
    <linearGradient id="srBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- 小火箭官方深蓝渐变 -->
    <linearGradient id="rocketOfficialBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <radialGradient id="srGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(185 220) scale(185)">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <filter id="iconShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#srBg)"/>
  
  <pattern id="srGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-opacity="0.04" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#srGrid)"/>

  <!-- 光晕 -->
  <circle cx="185" cy="220" r="185" fill="url(#srGlow)"/>

  <!-- 边框 -->
  <rect x="25" y="25" width="750" height="400" rx="16" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1.2"/>
  <rect x="28" y="28" width="744" height="394" rx="14" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- 左侧图形：iPhone 与官方 Shadowrocket 小火箭拟物图标 -->
  <g transform="translate(185, 220)">
    <ellipse cx="0" cy="120" rx="90" ry="16" fill="#000000" fill-opacity="0.65"/>

    <!-- iPhone 外框 -->
    <rect x="-72" y="-125" width="144" height="240" rx="28" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <rect x="-66" y="-119" width="132" height="228" rx="24" fill="#0b1120"/>
    
    <!-- 灵动岛 -->
    <rect x="-22" y="-111" width="44" height="11" rx="5.5" fill="#020617"/>

    <!-- 官方 Shadowrocket 小火箭图标卡片 -->
    <g transform="translate(0, -10)" filter="url(#iconShadow)">
      <rect x="-48" y="-48" width="96" height="96" rx="22" fill="url(#rocketOfficialBlue)" stroke="#60a5fa" stroke-opacity="0.7" stroke-width="1.5"/>
      
      <!-- 小火箭图标主体 -->
      <g transform="translate(0, -2) scale(1.15)">
        <!-- 弹体机身 -->
        <path d="M0 -26 C9 -17 15 -2 15 16 L-15 16 C-15 -2 -9 -17 0 -26 Z" fill="#ffffff"/>
        <!-- 尾翼 -->
        <path d="M-15 4 L-24 18 L-15 16 Z" fill="#93c5fd"/>
        <path d="M15 4 L24 18 L15 16 Z" fill="#93c5fd"/>
        <!-- 舷窗圆形 -->
        <circle cx="0" cy="-4" r="5" fill="#1d4ed8"/>
        <!-- 尾焰喷射 -->
        <path d="M-7 17 Q 0 32 7 17 Z" fill="#f59e0b"/>
        <path d="M-3.5 17 Q 0 26 3.5 17 Z" fill="#fef08a"/>
      </g>
    </g>

    <!-- 底部状态药丸 -->
    <rect x="-48" y="58" width="96" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="-34" cy="70" r="3.5" fill="#60a5fa"/>
    <text x="-24" y="74" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold">小火箭 · 配置正常</text>
  </g>

  <!-- 右侧排版文字 -->
  <g transform="translate(345, 75)">
    <!-- 顶部标签组 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="84" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1"/>
      <text x="42" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">iOS 经典</text>
      
      <rect x="94" y="0" width="104" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="146" y="17" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Shadowrocket</text>
      
      <rect x="208" y="0" width="112" height="26" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
      <text x="264" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">规则分流配置</text>
    </g>

    <!-- 主标题 -->
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">Shadowrocket 小火箭教程</text>
    <text x="0" y="112" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">正版下载 • 订阅导入 • 节点自动测速</text>

    <!-- 四项特性 -->
    <g transform="translate(0, 145)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 美区正版</text>
        <text x="88" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">防共享锁机风险</text>
      </g>
      
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 扫码/一键导入</text>
        <text x="115" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">秒速解析</text>
      </g>
      
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 智能分流</text>
        <text x="80" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">国内直连省流量</text>
      </g>
      
      <g transform="translate(205, 52)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">✓ 节点测速</text>
        <text x="80" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">自动优选低延迟</text>
      </g>
    </g>

    <!-- 底部状态栏 -->
    <g transform="translate(0, 270)">
      <line x1="0" y1="0" x2="395" y2="0" stroke="#334155" stroke-width="1"/>
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">晚风博客技术评测室 · WANFENGZN.COM</text>
      <text x="395" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="end">W 资深网络实测</text>
    </g>
  </g>
</svg>
